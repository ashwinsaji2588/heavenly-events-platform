name: occasion-desk

services:
  postgres:
    image: postgres:16-alpine
    container_name: occasion-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heavenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heavenly_secret}
      POSTGRES_DB: ${POSTGRES_DB:-heavenly_events}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heavenly} -d ${POSTGRES_DB:-heavenly_events}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-ghcr.io/ashwinsaji2588/occasion-desk:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: occasion-app
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-heavenly}:${POSTGRES_PASSWORD:-heavenly_secret}@postgres:5432/${POSTGRES_DB:-heavenly_events}?schema=public
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-occasion-desk-super-secure-production-secret-2026}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
