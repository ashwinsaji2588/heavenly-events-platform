name: heavenly-events

services:
  postgres:
    image: postgres:16-alpine
    container_name: heavenly-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heavenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heavenly_secret}
      POSTGRES_DB: ${POSTGRES_DB:-heavenly_events}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heavenly} -d ${POSTGRES_DB:-heavenly_events}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heavenly-app
    restart: always
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-heavenly}:${POSTGRES_PASSWORD:-heavenly_secret}@postgres:5432/${POSTGRES_DB:-heavenly_events}?schema=public
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-heavenly-events-super-secure-production-secret-2026}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
