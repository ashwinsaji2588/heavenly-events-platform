name: Build & Deploy via GitHub Container Registry (GHCR)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ashwinsaji2588/heavenly-events-platform

jobs:
  build-and-push:
    name: 🔨 Build Docker Image (GitHub Hosted 16GB Runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-oracle:
    name: 🚀 Fast Deploy to Oracle VM (Pull & Run)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST || '144.24.139.226' }}
          username: ${{ secrets.ORACLE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          timeout: 600s
          command_timeout: 600s
          envs: GITHUB_TOKEN,REGISTRY,IMAGE_NAME
          script: |
            echo "=== 1. Pulling latest code changes on Oracle VM ==="
            cd ~/heavenly-events-platform
            git pull origin main

            echo "=== 2. Authenticating Docker to GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== 3. Pulling pre-built Docker image from GHCR ==="
            sudo docker compose pull app

            echo "=== 4. Re-launching application container from pre-built image ==="
            sudo docker compose up -d app

            echo "=== 5. Syncing database schema & sanitizing records ==="
            sudo docker exec occasion-app npx prisma db push --skip-generate || sudo docker exec heavenly-app npx prisma db push --skip-generate || true
            sudo docker exec occasion-app node scripts/sanitize-db.mjs || sudo docker exec heavenly-app node scripts/sanitize-db.mjs || true

            echo "=== 6. Pruning old dangling images to preserve disk space ==="
            sudo docker image prune -f

            echo "=== 7. Health Check ==="
            SUCCESS=0
            for i in $(seq 1 12); do
              if curl -s -f -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 | grep -q "200\|304\|307"; then
                echo "✅ Health check passed: Next.js is responding on port 3000!"
                SUCCESS=1
                break
              fi
              echo "Waiting for Next.js app to become healthy (attempt $i/12)..."
              sleep 2
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Health check timed out after 24 seconds"
              sudo docker logs --tail 30 occasion-app || sudo docker logs --tail 30 heavenly-app
              exit 1
            fi

            echo "🎉 Deployment successfully completed in seconds with zero CPU bottleneck on VM!"
