name: Deploy to Oracle Cloud Always Free VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment to Oracle VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST || '144.24.139.226' }}
          username: ${{ secrets.ORACLE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "=== 1. Pulling latest code on Oracle VM ==="
            cd ~/heavenly-events-platform
            git pull origin main
            
            echo "=== 2. Building updated container image ==="
            sudo docker compose build app
            
            echo "=== 3. Restarting application container ==="
            sudo docker stop heavenly-app 2>/dev/null || true
            sudo docker rm heavenly-app 2>/dev/null || true
            sudo docker compose up -d app
            
            echo "=== 4. Syncing database schema ==="
            sudo docker exec heavenly-app npx prisma db push --skip-generate || true
            
            echo "=== 5. Deployment Health Check ==="
            sleep 3
            curl -I http://127.0.0.1:3000 || exit 1
            echo "🎉 Continuous Deployment successfully completed on Oracle VM!"
