name: Deploy to Oracle Cloud Always Free VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment to Oracle VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST || '144.24.139.226' }}
          username: ${{ secrets.ORACLE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "=== Pulling latest changes on Oracle VM ==="
            cd ~/heavenly-events-platform
            git pull origin main
            
            echo "=== Rebuilding and reloading container ==="
            sudo docker compose build app
            sudo docker compose up -d app
            
            echo "=== Syncing database schema ==="
            sudo docker exec heavenly-app npx prisma db push --skip-generate || true
            
            echo "=== Deployment Health Check ==="
            curl -I http://127.0.0.1:3000 || exit 1
            echo "Deployment successfully verified on Oracle VM!"
